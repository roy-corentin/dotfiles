# More option see https://github.com/DreamMaoMao/mango/wiki/

source = /home/croy/.config/mango/noctalia.conf

# --- Autostart ---
exec-once=noctalia
exec-once=vicinae server
exec-once=emacs --daemon
exec-once=/usr/lib/polkit-kde-authentication-agent-1
exec-once=wl-paste --type text --watch cliphist store
exec-once=wl-paste --type image --watch cliphist store

# keyboard
repeat_rate=25
repeat_delay=600
numlockon=0
xkb_rules_layout=fr

# Window effect
blur=0
blur_layer=0
blur_optimized=1
blur_params_num_passes = 2
blur_params_radius = 5
blur_params_noise = 0.02
blur_params_brightness = 0.9
blur_params_contrast = 0.9
blur_params_saturation = 1.2

shadows = 0
layer_shadows = 0
shadow_only_floating = 1
shadows_size = 10
shadows_blur = 15
shadows_position_x = 0
shadows_position_y = 0
# shadowscolor= 0x000000ff

border_radius=6
no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity=1.0

# Animation Configuration(support type:zoom,slide)
# tag_animation_direction: 1-horizontal,0-vertical
animations=1
layer_animations=1
animation_type_open=slide
animation_type_close=slide
layer_animation_type_open=slide
layer_animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
zoom_initial_ratio=0.4
zoom_end_ratio=0.8
fadein_begin_opacity=0.5
fadeout_begin_opacity=0.8
animation_duration_move=500
animation_duration_open=400
animation_duration_tag=350
animation_duration_close=800
animation_duration_focus=0
animation_curve_open=0.46,1.0,0.29,1
animation_curve_move=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0.08,1,0,1
animation_curve_focus=0.46,1.0,0.29,1
animation_curve_opafadeout=0.5,0.5,0.5,0.5
animation_curve_opafadein=0.46,1.0,0.29,1

# Scroller Layout Setting
scroller_structs=20
scroller_default_proportion=0.8
scroller_focus_center=0
scroller_prefer_center=0
edge_scroller_pointer_focus=1
edge_scroller_focus_allow_speed=0.0
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.8,1.0

# Master-Stack Layout Setting
new_is_master=0
default_mfact=0.55
default_nmaster=1
smartgaps=0

# Dwindle Layout Setting
dwindle_smart_split=0
dwindle_drop_simple_split=1
dwindle_manual_split=0
dwindle_hsplit=1
dwindle_vsplit=1
dwindle_preserve_split=0

# Overview Setting
hotarea_size=10
enable_hotarea=0
ov_tab_mode=1
ov_no_resize=1
overviewgappi=5
overviewgappo=30

# Misc
no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=1
idleinhibit_ignore_visible=0
sloppyfocus=1
warpcursor=1
focus_cross_monitor=0
focus_cross_tag=0
enable_floating_snap=1
snap_distance=30
cursor_size=24
drag_tile_to_tile=1
drag_tile_small=1

# Trackpad
# need relogin to make it apply
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=0
disable_while_typing=1
left_handed=0
middle_button_emulation=0
swipe_min_threshold=1

# Mouse
# need relogin to make it apply
mouse_natural_scrolling=0

# Gesture
# 3-finger: Workspace navigation
gesturebind=none,left,3,viewtoright_have_client
gesturebind=none,right,3,viewtoleft_have_client
gesturebind=none,up,3,toggleoverview
gesturebind=none,down,3,toggleoverview

# Appearance
gappih=5
gappiv=5
gappoh=10
gappov=10
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
borderpx=2
dropcolor=0x8FBA7C55
splitcolor=0xEB441EFF

blur=1
blur_layer=0
blur_params_radius=5
blur_params_num_passes=2

# layout support:
# tile,scroller,monocle,grid,deck,center_tile,vertical_tile,right_tile,vertical_scroller,vertical_grid,vertical_deck,dwindle,fair,vertical_fair
tagrule=id:1,layout_name:tile
tagrule=id:2,layout_name:tile
tagrule=id:3,layout_name:tile
tagrule=id:4,layout_name:scroller
tagrule=id:5,layout_name:tile
tagrule=id:6,layout_name:tile
tagrule=id:7,layout_name:tile
tagrule=id:8,layout_name:tile
# tagrule=id:9,layout_name:tile

# Key Bindings
# key name refer to `xev` or `wev` command output,
# mod keys name: super,ctrl,alt,shift,none

# reload config
binds=SUPER,r,reload_config

# menu and terminal
# bind=super,D,spawn,rofi -show drun
binds=SUPER,D,spawn,vicinae toggle
binds=SUPER,Return,spawn,ghostty +new-window

# exit
binds=SUPER,q,killclient,

# switch window focus
binds=SUPER,Tab,focusstack,next
binds=SUPER,H,focusdir,left
binds=SUPER,L,focusdir,right
binds=SUPER,K,focusdir,up
binds=SUPER,J,focusdir,down

# swap window
binds=SUPER+SHIFT,H,exchange_client,left
binds=SUPER+SHIFT,L,exchange_client,right
binds=SUPER+SHIFT,K,exchange_client,up
binds=SUPER+SHIFT,J,exchange_client,down

# switch window status
binds=SUPER,g,toggleglobal,
binds=SUPER,Tab,toggleoverview,
binds=SUPER,Space,togglefloating,
binds=SUPER,a,togglemaximizescreen,
binds=SUPER,f,togglefullscreen,
binds=SUPER+SHIFT,f,togglefakefullscreen,
binds=SUPER,i,minimized,
binds=SUPER,o,toggleoverlay,
binds=SUPER+SHIFT,I,restore_minimized
binds=SUPER,S,toggle_scratchpad
binds=SUPER+SHIFT,S,minimized

# scroller layout
binds=SUPER+ALT,e,set_proportion,1.0
binds=SUPER+ALT,x,switch_proportion_preset,
binds=SUPER+ALT+CTRL,h,scroller_stack,left
binds=SUPER+ALT+CTRL,l,scroller_stack,right
binds=SUPER+ALT+CTRL,k,scroller_stack,up
binds=SUPER+ALT+CTRL,j,scroller_stack,down

#dwindle layout(manual split mode)
binds=SUPER+SHIFT,Space,dwindle_toggle_split_direction

# switch layout
binds=SUPER+SHIFT,N,switch_layout

# tag switch
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
# bind=SUPER,9,view,9,0

# tag: move client to the tag and focus it
# tagsilent: move client to the tag and not focus it
# bind=Alt,1,tagsilent,1
bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
# bind=SUPER+SHIFT,9,tag,9,0

# monitor switch
binds=SUPER+Alt,H,tagmon,left
binds=SUPER+Alt,L,tagmon,right
binds=SUPER,comma,focusmon,left
binds=SUPER,semicolon,focusmon,right

# gaps
# bind=ALT+SHIFT,X,incgaps,1
# bind=ALT+SHIFT,Z,incgaps,-1
# bind=ALT+SHIFT,R,togglegaps

# movewin
binds=SUPER+SHIFT+CTRL,H,movewin,-50,+0
binds=SUPER+SHIFT+CTRL,L,movewin,+50,+0
binds=SUPER+SHIFT+CTRL,K,movewin,+0,-50
binds=SUPER+SHIFT+CTRL,J,movewin,+0,+50

# resizewin
binds=SUPER+CTRL,H,resizewin,-50,+0
binds=SUPER+CTRL,L,resizewin,+50,+0
binds=SUPER+CTRL,K,resizewin,+0,-50
binds=SUPER+CTRL,J,resizewin,+0,+50

# --- App launch binds missing from Mango ---
binds=SUPER+SHIFT,Return,spawn,kitty
binds=SUPER+CTRL,Return,spawn,kitty
binds=SUPER,E,spawn,dolphin
binds=SUPER+SHIFT,E,spawn,emacsclient -c -n -a 'emacs'
binds=SUPER+CTRL,E,spawn,ghostty -e emacsclient -t -a 'emacs -nw'
binds=SUPER,M,spawn,ghostty -e btop
binds=SUPER,V,spawn,~/.config/rofi/clipboardlist.sh
binds=SUPER,X,spawn,noctalia msg panel-toggle session
binds=SUPER+SHIFT,comma,spawn,qs -c noctalia-shell ipc call plugin:keybind-cheatsheet toggle

binds=SUPER,C,spawn,~/.config/hypr/scripts/colorpicker.sh

binds=CTRL+ALT,L,spawn,~/.config/hypr/scripts/suspend.sh

binds=SUPER+CTRL,A,spawn,kitty -e wiremix
binds=SUPER+CTRL,B,spawn,kitty -e bluetui
binds=SUPER+CTRL,W,spawn,kitty -e impala

# Notifications
binds=SUPER,N,spawn,noctalia msg panel-toggle control-center notifications
binds=SUPER+SHIFT,C,spawn,noctalia msg notification-clear-history
binds=SUPER+SHIFT,D,spawn,noctalia msg notification-dnd-toggle

# Wallpaper
binds=SUPER,W,spawn,noctalia msg panel-toggle wallpaper

# --- Media / brightness keys ---
bindl=NONE,XF86MonBrightnessUp,spawn,~/.config/hypr/scripts/brightness.sh --inc
bindl=NONE,XF86MonBrightnessDown,spawn,~/.config/hypr/scripts/brightness.sh --dec

bindl=NONE,XF86AudioRaiseVolume,spawn,~/.config/hypr/scripts/volume.sh --inc
bindl=NONE,XF86AudioLowerVolume,spawn,~/.config/hypr/scripts/volume.sh --dec
bindl=NONE,XF86AudioMute,spawn,~/.config/hypr/scripts/volume.sh --toggle
bindl=NONE,XF86AudioMicMute,spawn,~/.config/hypr/scripts/volume.sh --toggle-mic

bindl=NONE,XF86AudioNext,spawn,playerctl next
bindl=NONE,XF86AudioPause,spawn,playerctl play-pause
bindl=NONE,XF86AudioPlay,spawn,playerctl play-pause
bindl=NONE,XF86AudioPrev,spawn,playerctl previous
bindl=NONE,XF86AudioStop,spawn,playerctl stop

# --- Screenshot / recording ---
binds=NONE,Print,spawn,noctalia msg screenshot-region
binds=SUPER,Print,spawn,noctalia msg screenshot-fullscreen pick
binds=SHIFT,Print,spawn,wayscriber -a
binds=SUPER+CTRL,S,spawn,~/.config/hypr/scripts/screenrecord-menu.sh
binds=SUPER+SHIFT,T,spawn,~/.config/hypr/scripts/image-to-text.sh

# Mouse Button Bindings
# btn_left and btn_right can't bind none mod key
mousebinds=SUPER,btn_left,moveresize,curmove
mousebind=NONE,btn_middle,togglemaximizescreen,0
mousebinds=SUPER,btn_right,moveresize,curresize

# Axis Bindings
axisbinds=SUPER,UP,viewtoleft_have_client
axisbinds=SUPER,DOWN,viewtoright_have_client

# --- Window rules ---
# Generic floating apps
windowrule=isfloating:1,width:0.70,height:0.70,appid:blueberry.py|blueman-manager|org.kde.dolphin|org.gnome.Nautilus|org.gnome.NautilusPreviewer|com.gabm.satty|About|TUI.float|nm-connection-editor|org.pulseaudio.pavucontrol|org.kde.gwenview|Wiremix|waypaper
# File picker dialogs
windowrule=isfloating:1,width:0.70,height:0.70,appid:xdg-desktop-portal-wlr|xdg-desktop-portal-gtk|org.freedesktop.impl.portal.desktop.kde|sublime_text|DesktopEditors|org.gnome.Nautilus|waypaper|brave-browser|zen,title:^(Open.*Files?|Open [Ff]older.*|Save.*Files?|Save.*As|Save|All Files|.*wants to open.*|.*wants to save.*|[Cc]hoose.*|File.*Upload.*)
# Noctalia settings
windowrule=isfloating:1,width:0.70,height:0.70,appid:.*Noctalia.Settings.*
# Picture-in-picture
# Mango has isglobal/isoverlay but no exact pin/keep-aspect equivalent.
windowrule=isfloating:1,isglobal:1,isoverlay:0,isnoborder:1,focused_opacity:1,unfocused_opacity:1,width:600,height:338,offsetx:100,offsety:100,title:(Picture.?in.?[Pp]icture)
# Teams/Discord/Slack -> tag 1
windowrule=tags:1,appid:^(.*Microsoft Teams.*|teams-for-linux|discord|WebCord|[Ss]lack)$

# Browser -> tag 2
windowrule=tags:2,appid:(brave-browser|zen$)

# Emacs main -> tag 3
windowrule=tags:3,appid:emacs,title:.*GNU Emacs.*

# Deezer as named scratchpad-ish floating window
windowrule=isnamedscratchpad:1,isfloating:1,width:0.80,height:0.90,appid:deezer-desktop

windowrule=focused_opacity:0.9,unfocused_opacity:0.9,appid:^(kitty|Alacritty|com.mitchellh.ghostty)$

# layer rule
layerrule=noanim:1,noblur:1,layer_name:(selection|wayfreeze|noctalia-attached-panel|noctalia-screenshot-.*)

# Monitor
# Laptop display: 3k, 60Hz, positioned at origin
monitorrule=name:^eDP-1$,width:2880,height:1800,refresh:60,x:0,y:0,scale:1.5
monitorrule=name:^DP-4$,width:1920,height:1080,refresh:60,x:1920,y:0,scale:1
monitorrule=name:^DP-1$,width:1920,height:1080,refresh:60,x:1920,y:0,scale:1

# Env
env=GDK_BACKEND,wayland,x11,*
env=QT_QPA_PLATFORM,wayland;xcb
# env=QT_QPA_PLATFORMTHEME,qt6ct
env=QT_STYLE_OVERRIDE,kvantum
env=SDL_VIDEODRIVER,wayland
env=CLUTTER_BACKEND,wayland
env=MOZ_ENABLE_WAYLAND,1
env=ELECTRON_OZONE_PLATFORM_HINT,wayland
env=OZONE_PLATFORM,wayland
env=XDG_SESSION_TYPE,wayland
env=XDG_CURRENT_DESKTOP,mango
env=XDG_SESSION_DESKTOP,mango
env=XDG_MENU_PREFIX,arch-
env=DEBUGINFOD_URLS,https://debuginfod.archlinux.org